[workspace]
resolver = "3"
members = [
    "crates/avin",
    "crates/avin_model",
    "crates/avin_utils",
    "binds",
]

[workspace.package]
description = "Open source cross-platform trading system"
version = "0.4.0"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["Alex Avin <mr.alexavin@gmail.com>"]
repository = "https://github.com/arsvincere/avin"
homepage = "https://avin.info"
keywords = [ "algorithmic-trading", "trading" ]
categories = ["finance"]

[workspace.dependencies]
avin = { path = "crates/avin" }
avin_model = { path = "crates/avin_model" }
avin_utils = { path = "crates/avin_utils" }

chrono = "0.4"
pyo3 = { version = "0.29", features = ["chrono"] }
